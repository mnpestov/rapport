<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Раппорт</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    body {
      margin: 0;
      background-color: #ffffff;
    }

    .initial-loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #ABC6BA;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    .load-fallback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: sans-serif;
      color: #9B9A9A;
      font-size: 15px;
    }

    .load-fallback button {
      margin-top: 16px;
      padding: 10px 20px;
      background: #83942C;
      color: #FFF;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
  <script src="/telegram-web-app.js" defer></script>
  <script>
    function sendDiag(event) {
      var payload = JSON.stringify({ event: event, userAgent: navigator.userAgent });
      navigator.sendBeacon('/diag/log', new Blob([payload], { type: 'application/json' }));
    }

    window.addEventListener('DOMContentLoaded', function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        // Telemetry: track successful early ready
        sendDiag('AUTH_EARLY_READY_SUCCESS');
      } else {
        // Telemetry: track failure of early ready (SDK didn't load properly)
        sendDiag('AUTH_EARLY_READY_FAILED');
      }
    });

    // 8-second fallback
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && document.getElementById('initial-loader')) {
        root.innerHTML = '<div class="load-fallback">Не удалось загрузить.<br><button onclick="location.reload()">Повторить</button></div>';
        sendDiag('AUTH_TIMEOUT_FALLBACK');
      }
    }, 8000);
  </script>
</head>

<body>
  <div id="root">
    <div id="initial-loader" class="initial-loader"></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
